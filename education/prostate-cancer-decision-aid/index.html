<script>
var LE_MALE={50:30.0,51:29.1,52:28.2,53:27.3,54:26.4,55:25.6,56:24.7,57:23.9,58:23.0,59:22.2,60:21.4,61:20.6,62:19.8,63:19.1,64:18.3,65:17.6,66:16.9,67:16.2,68:15.5,69:14.8,70:14.2,71:13.5,72:12.9,73:12.3,74:11.7,75:11.1,76:10.6,77:10.0,78:9.5,79:9.0,80:8.5,81:8.0,82:7.6,83:7.1,84:6.7,85:6.3,86:5.9,87:5.6,88:5.2,89:4.9};

function getLE(age,sex){var tbl=sex==='female'?LE_FEMALE:LE_MALE;var a=Math.max(50,Math.min(89,Math.round(parseFloat(age))));return tbl[a]||null;}
function getRiskGroup(psa,gg,stage){gg=parseInt(gg);psa=parseFloat(psa);if(["N1","M1"].indexOf(stage)>-1)return"metastatic";if(gg===5||["T3b","T4"].indexOf(stage)>-1)return"very_high";if(gg>=4||psa>=20||stage==="T3a")return"high";if(gg===3&&["T3a","T3b","T4","N1","M1"].indexOf(stage)===-1)return"unfavorable_intermediate";if(gg<=2&&psa>=10&&psa<20&&["T3a","T3b","T4","N1","M1"].indexOf(stage)===-1)return"unfavorable_intermediate";if(gg===2&&psa<10&&["T2b","T2c"].indexOf(stage)>-1)return"favorable_intermediate";if(gg<=2&&["T2b","T2c"].indexOf(stage)>-1)return"favorable_intermediate";if(gg===2&&psa<10)return"favorable_intermediate";if(gg===1&&psa<10&&["T1a","T1b","T1c","T2a"].indexOf(stage)>-1)return"low";if(gg<=2&&psa<20)return"favorable_intermediate";return"unfavorable_intermediate";}
var RISK_INFO={very_low:{label:"Very Low Risk",color:"#22c55e",bg:"#f0fdf4",border:"#86efac",s10:"~99%",s15:"~96%",desc:"Excellent prognosis. Cancer is unlikely to cause harm in your lifetime if you are older or have significant health conditions.",nccn:"Active surveillance strongly preferred for most patients. Curative treatment appropriate if life expectancy >10 years and patient prefers definitive therapy."},low:{label:"Low Risk",color:"#84cc16",bg:"#f7fee7",border:"#bef264",s10:"~98%",s15:"~94%",desc:"Very good prognosis. Most men with low-risk prostate cancer die of other causes, not prostate cancer.",nccn:"Active surveillance is preferred for most patients. Radiation or surgery equally effective alternatives if treatment preferred."},favorable_intermediate:{label:"Favorable Intermediate Risk",color:"#eab308",bg:"#fefce8",border:"#fde047",s10:"~94%",s15:"~85%",desc:"Good prognosis. Treatment is generally recommended but active surveillance may be discussed in selected patients.",nccn:"Active surveillance is an option for carefully selected patients. Surgery or radiation (with or without short-course ADT) are standard curative options."},unfavorable_intermediate:{label:"Unfavorable Intermediate Risk",color:"#f97316",bg:"#fff7ed",border:"#fdba74",s10:"~88%",s15:"~75%",desc:"Moderate risk. Treatment is recommended. Combination approaches may improve outcomes.",nccn:"Active surveillance generally not recommended. Surgery or radiation + 4-6 months ADT are standard. HDR brachytherapy boost with EBRT is a high-quality option."},high:{label:"High Risk",color:"#ef4444",bg:"#fef2f2",border:"#fca5a5",s10:"~75%",s15:"~58%",desc:"Significant risk. Multi-modal treatment often needed. Goal is cure in healthy patients.",nccn:"Active surveillance not appropriate. EBRT + 18-24 months ADT is a standard option. Radical prostatectomy with lymph node dissection also curative. HDR boost can improve local control. Consider clinical trials."},very_high:{label:"Very High Risk",color:"#dc2626",bg:"#fef2f2",border:"#f87171",s10:"~55%",s15:"~40%",desc:"High risk of progression. Aggressive multi-modal treatment required in healthy patients.",nccn:"Active surveillance not appropriate. EBRT + 24-36 months ADT is preferred. Surgery may be appropriate in select cases at high-volume centers. HDR brachytherapy boost is beneficial. Multidisciplinary review strongly recommended."},metastatic:{label:"Regional / Metastatic",color:"#7c3aed",bg:"#faf5ff",border:"#c4b5fd",s10:"Variable",s15:"Variable",desc:"Disease beyond the prostate. Systemic treatment is typically required. Curative local therapy may still play a role in select cases.",nccn:"Systemic therapy (ADT with or without novel agents) is primary treatment. Curative radiation to prostate in oligometastatic disease under study. Surgery generally not recommended. Multidisciplinary care is essential."}};
var TREATMENTS=[{id:"active_surveillance",name:"Active Surveillance",short:"AS",icon:"&#128065;",color:"#0ea5e9",grad:"linear-gradient(135deg,#0ea5e9,#0284c7)",eligible:["very_low","low","favorable_intermediate"],overview:"Active surveillance (AS) means monitoring the cancer closely without immediate treatment. The goal is to avoid overtreatment while preserving the option to treat if the cancer progresses. It is not 'doing nothing' - it involves a structured protocol of PSA tests, biopsies, and MRI scans.",evidence:"PRIAS study (n=5,302): 10-yr metastasis-free survival ~97%. ProtecT trial: No significant difference in prostate-cancer-specific mortality between AS, surgery, and radiation at 15 years for low/intermediate risk. Johns Hopkins AS cohort: 99% cancer-specific survival at 10 years.",shortSE:[{e:"Anxiety / psychological burden",sev:"moderate",freq:"30-40%",time:"Ongoing",note:"Most significant concern for many patients. Decreases with time on protocol."},{e:"Biopsy discomfort / hematuria",sev:"mild",freq:"Common",time:"Days",note:"Transient. MRI-targeted biopsies reduce number of cores needed."},{e:"Biopsy-related infection (sepsis risk)",sev:"serious",freq:"<1%",time:"Days",note:"Risk reduced with transperineal approach, now preferred."},{e:"No immediate cancer treatment side effects",sev:"benefit",freq:"100%",time:"N/A",note:"Bowel, bladder, and sexual function fully preserved."}],longSE:[{e:"Risk of cancer progression (~30-40% reclassified by 10 yrs)",sev:"moderate",freq:"~30-40%",time:"10 years",note:"Most men who progress can still be treated curatively."},{e:"Potential for metastasis if monitoring fails",sev:"serious",freq:"<2%",time:"15 years",note:"Very low in properly monitored patients."},{e:"Sustained preservation of urinary, sexual, bowel function",sev:"benefit",freq:"Majority",time:"Long-term",note:"Best QoL profile among all approaches at 5 years (ProtecT trial)."}],qol:{erectile:{s:9,l:"Best preserved"},urinary:{s:9,l:"Best preserved"},bowel:{s:9,l:"Not affected"},hormone:{s:9,l:"Not affected"},anxiety:{s:5,l:"Moderate concern"}},stats:[{v:"<1%",l:"Cancer-specific mortality (10 yr)",c:"Low-risk AS cohorts"},{v:"~97%",l:"Metastasis-free survival (10 yr)",c:"PRIAS 2022 data"},{v:"~50-60%",l:"Conversion to treatment (10 yr)",c:"Many upgrade; most still cured"},{v:"~85%",l:"Sexual function preserved",c:"vs. 40-60% with surgery"}],bestFor:["Low/very low risk disease","Older patients (>65-70) with low-risk cancer","Men who prioritize quality of life over definitive treatment","Grade Group 1 with life expectancy <10-15 years"],notFor:["Grade Group 3 or higher","Unfavorable or high-risk disease","Men with severe anxiety about untreated cancer","Inability to comply with monitoring protocol"],monitoring:["PSA every 3-6 months for first 2 years, then every 6-12 months","Multiparametric MRI (mpMRI) at diagnosis and every 2-3 years","Confirmatory biopsy (often MRI-guided) within 6-12 months of enrollment","Repeat biopsy every 2-5 years or if PSA rises significantly","PSADT monitored - rapid doubling <3 years prompts reassessment"],adtDuration:null},{id:"robotic_rp",name:"Robotic Radical Prostatectomy",short:"RARP",icon:"&#129302;",color:"#6366f1",grad:"linear-gradient(135deg,#6366f1,#4f46e5)",eligible:["low","favorable_intermediate","unfavorable_intermediate","high","very_high"],overview:"Robot-assisted radical prostatectomy (RARP) is minimally invasive surgical removal of the prostate using the da Vinci robotic system. It is now the most commonly performed prostatectomy in North America (>85% of cases), offering faster recovery than open surgery with equivalent oncologic outcomes.",evidence:"Multiple RCTs and large registry studies show equivalent oncologic outcomes between RARP and open RP. RARP is associated with lower blood loss, shorter hospital stay (1-2 days vs 3-5), and faster catheter removal. PIVOT trial: RP reduced metastasis and all-cause mortality vs. watchful waiting in intermediate/high-risk men under 65.",shortSE:[{e:"Stress urinary incontinence",sev:"moderate-severe",freq:"50-90% at 3 months",time:"Weeks-months",note:"The most bothersome early complication. Requires pads initially."},{e:"Erectile dysfunction (ED)",sev:"severe",freq:"40-80% at 3 months",time:"Months-years",note:"Recovery depends heavily on nerve-sparing, age, and baseline function."},{e:"Hospital stay",sev:"mild",freq:"100%",time:"1-2 days",note:"Short compared to open surgery."},{e:"Urethral catheter at home",sev:"moderate",freq:"100%",time:"7-14 days",note:"Worn after discharge. Removed in clinic."},{e:"Post-op fatigue and wound pain",sev:"mild-moderate",freq:"Common",time:"1-4 weeks",note:"Return to light activity ~2 weeks; full activity 4-6 weeks."},{e:"Lymphedema",sev:"mild-moderate",freq:"3-5%",time:"Months",note:"More common when extended pelvic lymph node dissection performed."}],longSE:[{e:"Urinary incontinence (long-term)",sev:"moderate",freq:"5-15%",time:"1+ year",note:"Most men recover continence by 12 months. Pad-free rates ~85-90% at 1 year in high-volume centers."},{e:"Erectile dysfunction (long-term)",sev:"moderate-severe",freq:"20-60%",time:"2+ years",note:"Bilateral nerve-sparing in young men: ~60-70% recovery. Unilateral: ~40-50%. No nerve-sparing: ~10-20%."},{e:"Dry orgasm / anejaculation",sev:"moderate",freq:"100%",time:"Permanent",note:"No ejaculate produced. Orgasm sensation usually preserved."},{e:"Infertility",sev:"severe (if relevant)",freq:"100%",time:"Permanent",note:"Sperm banking should be discussed for younger patients who wish to preserve fertility."},{e:"Biochemical recurrence monitoring",sev:"varies",freq:"~20-35% high-risk",time:"Long-term",note:"PSA should become undetectable. Any detectable PSA >0.2 ng/mL = biochemical recurrence."},{e:"Inguinal hernia",sev:"mild",freq:"10-15%",time:"Years",note:"Higher rate than open RP."}],qol:{erectile:{s:5,l:"Moderate impact (recovers)"},urinary:{s:5,l:"Early impact, improves"},bowel:{s:9,l:"Not affected"},hormone:{s:9,l:"No ADT needed"},anxiety:{s:8,l:"PSA monitoring gives clarity"}},stats:[{v:"~85%",l:"10-yr biochemical recurrence-free survival",c:"Low/intermediate risk"},{v:"~85-90%",l:"Continent at 1 year (0 pads)",c:"High-volume centers"},{v:"~60-70%",l:"Erectile function recovery (bilateral NS)",c:"Age <65, good baseline"},{v:"<10%",l:"Positive surgical margin (low-risk)",c:"High-volume robotic centers"}],bestFor:["Younger patients (<65-70) with good baseline sexual function","High-risk disease where pathological staging and lymph node dissection is desired","Patients who want definitive single-treatment option","Bladder or bowel issues that would be worsened by radiation"],notFor:["Severe cardiac/pulmonary comorbidity precluding surgery","Very high or locally advanced disease extending to pelvic sidewall","Patients who cannot tolerate general anesthesia"],monitoring:null,adtDuration:null},{id:"open_rp",name:"Open Radical Prostatectomy",short:"ORP",icon:"&#127973;",color:"#8b5cf6",grad:"linear-gradient(135deg,#8b5cf6,#7c3aed)",eligible:["low","favorable_intermediate","unfavorable_intermediate","high","very_high"],overview:"Open retropubic radical prostatectomy (ORP) is the traditional surgical approach through a lower abdominal incision. While largely supplanted by robotic surgery, it remains an important option at select institutions with high-volume open surgical expertise. Oncologic outcomes are equivalent to robotic.",evidence:"Multiple comparative studies show no significant difference in oncologic outcomes, PSM rates, or functional recovery between ORP and RARP. RARP offers reduced blood transfusion (1% vs 10%), shorter hospital stay, and faster catheter removal. Open approach may suit complex anatomy or very large prostates.",shortSE:[{e:"Stress urinary incontinence",sev:"moderate-severe",freq:"50-85% at 3 months",time:"Weeks-months",note:"Similar recovery trajectory to RARP."},{e:"Erectile dysfunction",sev:"severe",freq:"40-80%",time:"Months-years",note:"Similar long-term outcomes to RARP with equivalent nerve-sparing."},{e:"Blood transfusion",sev:"moderate",freq:"3-10%",time:"Intraoperative",note:"Higher than RARP due to open dissection."},{e:"Hospital stay",sev:"moderate",freq:"100%",time:"3-5 days",note:"Longer than robotic approach."},{e:"Post-op pain and larger incision",sev:"moderate",freq:"Common",time:"2-6 weeks",note:"Larger incision leads to more wound pain initially."}],longSE:[{e:"Urinary incontinence (long-term)",sev:"moderate",freq:"5-20%",time:"1+ year",note:"Broadly equivalent to RARP at 1-2 years in experienced hands."},{e:"Erectile dysfunction",sev:"moderate-severe",freq:"20-60%",time:"2+ years",note:"Equivalent to RARP with same nerve-sparing technique."},{e:"Dry orgasm / infertility",sev:"moderate-severe",freq:"100%",time:"Permanent",note:"As with all radical prostatectomy."},{e:"Incisional hernia",sev:"mild",freq:"2-5%",time:"Months-years",note:"Slightly higher than robotic."}],qol:{erectile:{s:5,l:"Moderate impact (recovers)"},urinary:{s:5,l:"Early impact, improves"},bowel:{s:9,l:"Not affected"},hormone:{s:9,l:"No ADT needed"},anxiety:{s:8,l:"PSA monitoring gives clarity"}},stats:[{v:"~83%",l:"10-yr biochemical recurrence-free survival",c:"Low/intermediate risk"},{v:"~80-88%",l:"Continent at 1 year (0 pads)",c:"High-volume centers"},{v:"~55-65%",l:"Erectile function recovery",c:"Bilateral NS, age <65"},{v:"3-10%",l:"Blood transfusion rate",c:"vs 0.5-2% RARP"}],bestFor:["Institutions with high-volume open surgical expertise","Very large prostates (>100cc) where robotic approach is difficult","Prior abdominal/pelvic surgery making robotic approach complex","Patients in regions without robotic access"],notFor:["Severe comorbidity precluding open surgery","Patient preference for minimally invasive approach when equivalent outcomes possible"],monitoring:null,adtDuration:null},{id:"ebrt_adt",name:"EBRT + Hormonal Therapy (ADT)",short:"EBRT+ADT",icon:"&#9762;",color:"#f59e0b",grad:"linear-gradient(135deg,#f59e0b,#d97706)",eligible:["favorable_intermediate","unfavorable_intermediate","high","very_high"],overview:"External beam radiotherapy (EBRT) combined with androgen deprivation therapy (ADT) is the most widely used non-surgical treatment for intermediate and high-risk prostate cancer. Modern EBRT uses intensity-modulated radiation therapy (IMRT) with image-guided delivery (IGRT), allowing high doses with precision. ADT reduces the prostate size and sensitizes cancer cells to radiation.",evidence:"RTOG 9202, RTOG 9413, DART 01/05: Long-term ADT (24-28 months) for high-risk disease improves overall survival vs. EBRT alone. DART 01/05: 5-yr survival 91% (long-term ADT) vs 79% (short-term ADT). CHHiP trial: Moderate hypofractionation (60 Gy/20 fx) non-inferior to conventional 74 Gy/37 fx. FLAME trial: Dose-escalation to dominant lesion improves 5-yr BCR-free survival.",shortSE:[{e:"Fatigue",sev:"moderate",freq:"50-70%",time:"During treatment + weeks after",note:"Common during RT course (7-8 weeks conventional). Usually resolves 4-8 weeks post-treatment."},{e:"Urinary frequency / urgency (radiation cystitis)",sev:"moderate",freq:"30-50%",time:"During + 4-8 weeks after",note:"Usually self-limiting. Treated with alpha-blockers, NSAIDs."},{e:"Diarrhea / rectal urgency (radiation proctitis)",sev:"moderate",freq:"20-40%",time:"During + 4-8 weeks after",note:"Managed with dietary modification. IMRT/IGRT minimizes bowel dose."},{e:"ADT side effects: hot flashes, fatigue, mood changes",sev:"moderate-severe",freq:"Very common with ADT",time:"During ADT course",note:"Also includes loss of libido and breast tenderness (gynecomastia)."},{e:"No surgery / no anesthesia required",sev:"benefit",freq:"100%",time:"N/A",note:"No operative risk, suitable for medically unfit patients."}],longSE:[{e:"Late radiation proctitis / rectal bleeding",sev:"moderate",freq:"5-15%",time:"2-5+ years",note:"Grade 2-3 late rectal toxicity. Risk minimized with IMRT/IGRT and SpaceOAR hydrogel."},{e:"Late urinary stricture / hematuria",sev:"moderate",freq:"3-10%",time:"Years",note:"Radiation urethritis and late cystitis. Risk ~5-8% grade 2-3."},{e:"Erectile dysfunction (radiation-induced, progressive)",sev:"moderate",freq:"30-50% at 5 years",time:"Years",note:"Less acute than surgery but progresses with time. ADT worsens this significantly."},{e:"Secondary malignancy risk (radiation)",sev:"rare",freq:"<1% lifetime risk increase",time:"10-20 years",note:"Very small absolute risk increase in bladder/rectal cancer (~0.1-0.5%). Benefits far outweigh risk."},{e:"ADT: osteoporosis (bone density loss ~3-5%/yr)",sev:"moderate-severe",freq:"High with long-term ADT",time:"Years",note:"Bisphosphonates/denosumab + calcium/Vitamin D required."},{e:"ADT: metabolic syndrome / cardiovascular risk",sev:"moderate-severe",freq:"~30-50% with long-term ADT",time:"Months-years",note:"Increased insulin resistance, weight gain, hyperlipidemia. Exercise and monitoring essential."},{e:"ADT: cognitive effects and fatigue",sev:"moderate",freq:"20-40%",time:"During ADT",note:"Verbal memory decline reported. Usually reversible after ADT cessation."},{e:"ADT: near-complete loss of sexual function",sev:"severe",freq:"90-100% during ADT",time:"During ADT (reversible)",note:"Recovers months to 1+ year after ADT stops."}],qol:{erectile:{s:6,l:"Moderate impact (slower onset)"},urinary:{s:7,l:"Mild-moderate impact"},bowel:{s:6,l:"Moderate impact (long-term)"},hormone:{s:4,l:"Significant ADT effects"},anxiety:{s:7,l:"PSA monitoring reassures"}},stats:[{v:"~75-85%",l:"10-yr overall survival (high-risk + long-term ADT)",c:"DART 01/05, RTOG trials"},{v:"~85-90%",l:"5-yr BCR-free survival",c:"Intermediate risk, IMRT 78 Gy"},{v:"2-5%",l:"Grade 3+ late GI toxicity",c:"Modern IMRT/IGRT"},{v:"3-7%",l:"Grade 3+ late GU toxicity",c:"Modern IMRT/IGRT"}],bestFor:["Intermediate and high-risk disease","Men who want to avoid surgery and its immediate side effects","Locally advanced disease where surgery may be insufficient","Medically unfit for surgery","Men who value preserving erectile function short-term"],notFor:["Prior pelvic radiation","Inflammatory bowel disease (relative contraindication)","Active bladder pathology where RT would worsen","Very low/low risk - ADT not indicated"],monitoring:null,adtDuration:{favorable_intermediate:"0 to 4-6 months (per risk factors)",unfavorable_intermediate:"4-6 months",high:"18-24 months",very_high:"24-36 months"}},{id:"hdr_brachy",name:"HDR Brachytherapy (with or without EBRT)",short:"HDR",icon:"&#128161;",color:"#10b981",grad:"linear-gradient(135deg,#10b981,#059669)",eligible:["favorable_intermediate","unfavorable_intermediate","high","very_high"],overview:"High-dose-rate (HDR) brachytherapy delivers radiation from within the prostate using temporary iridium-192 needles inserted under anesthesia. It can be used as monotherapy for selected intermediate-risk patients, or as a boost combined with EBRT for intermediate/high-risk disease. HDR brachytherapy achieves the highest biologically effective dose (BED) of any prostate radiation technique.",evidence:"ASCENDE-RT RCT (King et al. 2015): HDR boost + EBRT showed significantly better 9-yr biochemical progression-free survival vs EBRT alone (83% vs 75%, p<0.001) for intermediate/high-risk disease. Multiple phase 3 data support HDR boost. ISUP 2019 consensus supports HDR monotherapy for low/favorable-intermediate risk.",shortSE:[{e:"Urinary symptoms post-implant (LUTS)",sev:"moderate-severe",freq:"60-80%",time:"Days-weeks",note:"Urinary frequency, urgency, dysuria. Usually resolves within 4-8 weeks."},{e:"Urinary retention",sev:"moderate",freq:"5-15%",time:"Days-weeks",note:"May require temporary catheter. Higher risk with large prostate."},{e:"Perineal discomfort from needle insertion",sev:"mild-moderate",freq:"Common",time:"Days",note:"From transperineal needle placement. Managed with NSAIDs."},{e:"Anesthesia requirement",sev:"mild",freq:"100%",time:"1-2 day hospital stay",note:"Requires spinal or general anesthesia for needle implant."},{e:"Rectal urgency",sev:"mild",freq:"10-20%",time:"Weeks",note:"Rectal dose closely monitored and constrained."}],longSE:[{e:"Urethral stricture",sev:"moderate",freq:"3-8%",time:"Years",note:"One of the more common long-term issues. May require dilation."},{e:"Erectile dysfunction",sev:"moderate",freq:"25-50% at 5 years",time:"Progressive",note:"Lower acute ED rates vs surgery; similar to EBRT at 5+ years."},{e:"Late rectal toxicity",sev:"mild-moderate",freq:"3-7%",time:"Years",note:"Grade 2-3 proctitis. Lower rates than LDR brachytherapy."},{e:"Bowel urgency",sev:"mild",freq:"5-10%",time:"Long-term",note:"Can persist in some patients, especially with EBRT combination."},{e:"PSA bounce (transient benign PSA rise)",sev:"mild",freq:"30-40%",time:"12-24 months",note:"Does not indicate recurrence. Reassurance important."}],qol:{erectile:{s:7,l:"Moderate impact (better than surgery)"},urinary:{s:6,l:"Moderate early impact"},bowel:{s:7,l:"Mild-moderate impact"},hormone:{s:6,l:"ADT often needed for high-risk"},anxiety:{s:7,l:"Good oncologic reassurance"}},stats:[{v:"83%",l:"9-yr BCR-free (ASCENDE-RT)",c:"HDR boost vs 75% EBRT alone"},{v:"~90-95%",l:"10-yr local control",c:"High-risk with EBRT+HDR boost"},{v:"3-8%",l:"Grade 3+ GU toxicity",c:"Long-term stricture risk"},{v:"2-5%",l:"Grade 3+ rectal toxicity",c:"Modern technique"}],bestFor:["Intermediate and high-risk disease as EBRT boost","Patients prioritizing maximum local tumor control","Favorable-intermediate risk as monotherapy option","Men wanting to preserve sexual function better than surgery"],notFor:["Very large prostate (>60-80cc) without downsizing with ADT","Prior TURP (increased stricture risk)","Prior pelvic radiation","Inability to tolerate anesthesia"],monitoring:null,adtDuration:{favorable_intermediate:"Sometimes (short course)",unfavorable_intermediate:"4-6 months",high:"18-24 months",very_high:"24-36 months"}}];
var state={step:0,profile:{age:"",psa:"",gg:"",stage:"T1c",sex:"male"},riskGroup:null,le:null,selectedTx:[],expandedTx:{},priorities:{sexual:3,urinary:3,bowel:3,speed:3,noSurgery:3,noHormones:3},leCalc:{age:"",sex:"male",result:null}};
var STEP_LABELS=["Your Profile","Risk Group","Treatment Details","Side-by-Side","Your Summary"];
function severityColor(s){var m={none:"#22c55e",mild:"#84cc16",moderate:"#f59e0b","moderate-severe":"#f97316",severe:"#ef4444",serious:"#dc2626",benefit:"#0ea5e9",rare:"#a3a3a3"};return m[s]||"#6b7280";}
function scoreColor(s){return s>=8?"#22c55e":s>=6?"#f59e0b":"#ef4444";}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function calcRiskAndLE(){var p=state.profile;if(p.age&&p.psa&&p.gg){state.riskGroup=getRiskGroup(p.psa,p.gg,p.stage);state.le=getLE(p.age,p.sex);}else{state.riskGroup=null;state.le=null;}}
function eligibleTx(){if(!state.riskGroup)return TREATMENTS;return TREATMENTS.filter(function(t){return t.eligible.indexOf(state.riskGroup)>-1;});}
function canProceed(){if(state.step===0)return!!(state.profile.age&&state.profile.psa&&state.profile.gg);if(state.step===2)return state.selectedTx.length>=1;return true;}
function renderProgress(){var pb=document.getElementById("progress-bar");var html="";STEP_LABELS.forEach(function(label,i){var isDone=i<state.step,isActive=i===state.step;html+='<div class="step-item"><button class="step-btn'+(isDone?" done":"")+(isActive?" active":"")+'" '+(isDone?'onclick="goToStep('+i+')"':'')+' style="pointer-events:'+(isDone?"auto":"none")+'"><div class="step-dot'+(isDone?" done-dot":"")+(isActive?" active-dot":"")+'">'+(isDone?"&#10003;":i+1)+'</div><span class="step-label'+(isActive?" active-label":"")+'">'+(label)+'</span></button>';if(i<STEP_LABELS.length-1)html+='<div class="step-connector'+(isDone?" done-line":"")+'"></div>';html+='</div>';});pb.innerHTML=html;var dt=document.getElementById("dot-track");var dhtml="";STEP_LABELS.forEach(function(_,i){var cls=i<state.step?"done-pill":i===state.step?"active-pill":"pending-pill";dhtml+='<div class="dot-pill '+cls+'"></div>';});dt.innerHTML=dhtml;}

function renderStep0(){var p=state.profile;var leRes=state.leCalc.result;return'<div class="fade-in"><h2 class="section-title">Tell Us About You</h2><p class="section-sub">Enter your information below. This decision aid personalizes treatment options and risk estimates based on NCCN, AUA, and EAU clinical guidelines (2024).</p><div class="form-grid"><div><label class="field-label">Your Age</label><input type="number" id="inp-age" value="'+esc(p.age)+'" placeholder="e.g. 65" min="40" max="90" oninput="updateProfile(\'age\',this.value)" /><p class="field-help">Your current age affects treatment recommendations and life expectancy estimates.</p></div><div><label class="field-label">PSA Level (ng/mL)</label><input type="number" id="inp-psa" value="'+esc(p.psa)+'" placeholder="e.g. 6.5" step="0.1" oninput="updateProfile(\'psa\',this.value)" /><p class="field-help">Most recent PSA value at diagnosis. Use the value used for staging.</p></div><div><label class="field-label">Grade Group (Gleason)</label><select id="inp-gg" onchange="updateProfile(\'gg\',this.value)"><option value="" '+(p.gg==""?"selected":"")+'>Select Grade Group</option><option value="1" '+(p.gg==="1"?"selected":"")+'>Grade Group 1 &mdash; Gleason 3+3=6 (Low-grade)</option><option value="2" '+(p.gg==="2"?"selected":"")+'>Grade Group 2 &mdash; Gleason 3+4=7 (Mostly low-grade)</option><option value="3" '+(p.gg==="3"?"selected":"")+'>Grade Group 3 &mdash; Gleason 4+3=7 (Mostly high-grade)</option><option value="4" '+(p.gg==="4"?"selected":"")+'>Grade Group 4 &mdash; Gleason 4+4 / 3+5 / 5+3=8</option><option value="5" '+(p.gg==="5"?"selected":"")+'>Grade Group 5 &mdash; Gleason 4+5 / 5+4 / 5+5=9-10</option></select><p class="field-help">From your biopsy pathology report. Grade Group is the most important prognostic factor.</p></div><div><label class="field-label">Clinical Stage</label><select id="inp-stage" onchange="updateProfile(\'stage\',this.value)"><option value="T1a" '+(p.stage==="T1a"?"selected":"")+'>T1 function renderStep4(){var ri=state.riskGroup?RISK_INFO[state.riskGroup]:null;var p=state.profile;var scored=TREATMENTS.map(function(t){var sc=0;if(!state.riskGroup||t.eligible.indexOf(state.riskGroup)>-1)sc+=20;sc+=(t.qol.erectile.s/10)*state.priorities.sexual*4;sc+=(t.qol.urinary.s/10)*state.priorities.urinary*4;sc+=(t.qol.bowel.s/10)*state.priorities.bowel*4;if(state.priorities.noSurgery>=4&&["active_surveillance","ebrt_adt","hdr_brachy"].indexOf(t.id)>-1)sc+=12;if(state.priorities.noHormones>=4&&["active_surveillance","robotic_rp","open_rp"].indexOf(t.id)>-1)sc+=12;if(state.priorities.speed>=4&&["robotic_rp","open_rp"].indexOf(t.id)>-1)sc+=8;return Object.assign({},t,{score:Math.round(sc)});}).sort(function(a,b){return b.score-a.score;});var top=scored[0];var questions=["What is my chance of cure with each option?","What is the risk of incontinence and how long does it last?","What are the chances of erectile dysfunction, and can it be treated?","Do I need hormone therapy, and for how long?","What happens if the cancer comes back?","Should I get genomic testing (Decipher, Prolaris, Oncotype DX)?","What is your personal volume for this procedure?","Can I speak to a patient who has undergone each treatment?","Is there a clinical trial I should consider?","What is my 10-year risk of dying from prostate cancer vs. other causes?"];var rankHtml=scored.map(function(t,i){var isEligible=!state.riskGroup||t.eligible.indexOf(state.riskGroup)>-1;var isTop=i===0;return'<div class="ranked-item" style="'+(isTop?"background:"+t.color+"10;border-color:"+t.color+"50;":"")+'"><div class="rank-num'+(isTop?" top":"")+'" style="'+(isTop?"background:"+t.color+";":"")+'">'+(i+1)+'</div><span style="font-size:1.1rem;">'+t.icon+'</span><div style="flex:1;"><div class="rank-name">'+esc(t.name)+'</div><div class="rank-note">'+(isEligible?"Appropriate for your risk group":"&#9888; Not typically recommended for your risk group")+'</div></div><div style="text-align:right;"><div class="rank-score-val" style="color:'+t.color+';">'+t.score+'</div><div style="font-size:0.68rem;color:#94a3b8;">priority score</div></div></div>';}).join("");var qHtml=questions.map(function(q,i){return'<div class="question-item"><span class="question-num">'+(i+1)+'.</span><span class="question-text">'+esc(q)+'</span></div>';}).join("");return'<div class="fade-in"><h2 class="section-title">Your Personalized Summary</h2><p class="section-sub">This summary reflects your cancer profile, life expectancy, and stated priorities. Use it as a starting point for discussion with your care team.</p>'+(ri?'<div class="profile-summary" style="background:'+ri.bg+';border-color:'+ri.border+';"><div class="profile-summary-grid"><div><div class="profile-item-lbl" style="color:'+ri.color+';">Risk Group</div><div class="profile-item-val" style="color:'+ri.color+';">'+esc(ri.label)+'</div></div><div><div class="profile-item-lbl" style="color:#64748b;">PSA</div><div class="profile-item-val">'+esc(p.psa)+' ng/mL</div></div><div><div class="profile-item-lbl" style="color:#64748b;">Grade Group</div><div class="profile-item-val">GG'+esc(p.gg)+'</div></div><div><div class="profile-item-lbl" style="color:#64748b;">Stage</div><div class="profile-item-val">'+esc(p.stage)+'</div></div>'+(state.le?'<div><div class="profile-item-lbl" style="color:#64748b;">Life Expectancy</div><div class="profile-item-val" style="color:#10b981;">~'+state.le.toFixed(0)+' years</div></div>':"")+' <div><div class="profile-item-lbl" style="color:#64748b;">10-yr Cancer Survival</div><div class="profile-item-val" style="color:#0ea5e9;">'+esc(ri.s10)+'</div></div></div></div>':"")+' <div class="top-match-box" style="background:'+top.color+'0f;border-color:'+top.color+'40;"><div class="top-match-tag" style="color:'+top.color+';">&#127919; Best Match Based on Your Priorities</div><div class="top-match-name">'+top.icon+' '+esc(top.name)+'</div><p style="color:#4b5563;font-size:0.87rem;line-height:1.65;margin:0;">This treatment best aligns with your stated priorities and your cancer risk group. This is a decision-support tool only &mdash; final decisions require consultation with your medical team.</p></div><div class="mb125"><h3 style="font-size:0.95rem;font-weight:800;color:#1e293b;margin-bottom:0.65rem;">All Options &mdash; Priority-Weighted Ranking</h3>'+rankHtml+'</div><div class="card" style="background:#fafafa;margin-bottom:1.25rem;"><h3 style="font-size:0.95rem;font-weight:800;color:#1e293b;margin-bottom:0.65rem;">&#128203; Questions to Ask Your Care Team</h3><div class="questions-grid">'+qHtml+'</div></div><div class="card card-yellow"><p style="font-size:0.81rem;color:#78350f;line-height:1.7;margin:0;"><strong>Important Disclaimer:</strong> This decision aid is based on NCCN Clinical Practice Guidelines (2024 v.2), AUA/ASTRO/SUO Guidelines, EAU Guidelines, and published high-quality evidence including ProtecT, ASCENDE-RT, DART 01/05, RTOG, PIVOT, and PRIAS trials. It is intended to support &mdash; not replace &mdash; shared decision-making with your urologist, radiation oncologist, and multidisciplinary cancer team. Individual outcomes vary based on cancer biology, surgeon/center experience, comorbidities, and patient-specific factors not captured here. Genomic testing (e.g., Decipher, Prolaris, Oncotype DX Genomic Prostate Score) may further refine your individual risk assessment.</p></div></div>';}
function render(){calcRiskAndLE();var content=document.getElementById("app-content");var renderers=[renderStep0,renderStep1,renderStep2,renderStep3,renderStep4];content.innerHTML=renderers[state.step]();renderProgress();renderFooter();window.scrollTo({top:0,behavior:"smooth"});}
function updateProfile(key,val){state.profile[key]=val;calcRiskAndLE();renderProgress();renderFooter();}
function doLeCalc(){var age=parseFloat(document.getElementById("le-age")?document.getElementById("le-age").value:state.leCalc.age);var sex=document.getElementById("le-sex")?document.getElementById("le-sex").value:state.leCalc.sex;if(!age||age<30||age>100)return;state.leCalc.age=String(age);state.leCalc.sex=sex;state.leCalc.result=getLE(age,sex);if(state.step===0)render();}
function toggleExpand(id){state.expandedTx[id]=!state.expandedTx[id];render();}
function toggleSelect(id){var idx=state.selectedTx.indexOf(id);if(idx>-1)state.selectedTx.splice(idx,1);else state.selectedTx.push(id);render();}
function updatePriority(key,val){state.priorities[key]=parseInt(val);var el=document.getElementById("pval-"+key);if(el)el.textContent=val+"/5";}
function goNext(){if(!canProceed())return;if(state.step<4){state.step++;render();}}
function goBack(){if(state.step>0){state.step--;render();}}
function goToStep(i){if(i<state.step){state.step=i;render();}}
function restartApp(){state={step:0,profile:{age:"",psa:"",gg:"",stage:"T1c",sex:"male"},riskGroup:null,le:null,selectedTx:[],expandedTx:{},priorities:{sexual:3,urinary:3,bowel:3,speed:3,noSurgery:3,noHormones:3},leCalc:{age:"",sex:"male",result:null}};render();}
render();
</script>
